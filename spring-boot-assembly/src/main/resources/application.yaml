# WriteFlow application configuration
spring:
  application:
    name: writeflow

  temporal:
    start-workers: false
    connection:
      target: ${TEMPORAL_TARGET:localhost:7233}
    workers-auto-discovery:
      packages:
        - com.manning.writeflow.workflow
    workers:
      - task-queue: publication

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./data/writeflowdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

server:
  port: 8086
  max-http-request-header-size: 16KB
  servlet:
    context-path: /
  forward-headers-strategy: FRAMEWORK

management:
  security:
    enabled: false
  health:
    vault:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics
    health:
      show-details: always
      show-components: always

logging:
  level:
    com.manning.writeflow.api: TRACE

writeflow:
  outbox-relay:
    interval: ${OUTBOX_RELAY_INTERVAL:1s}
